name: Build news pages

# Пересобирает статические страницы новостей, когда меняются данные.
# Админка коммитит только news/data/*.json и картинки — этот workflow
# генерирует news.html, news/<slug>.html, news/index.json, news/rss.xml
# и обновляет sitemap.xml, затем коммитит результат обратно.

on:
  push:
    branches: [main]
    paths:
      - 'news/data/**'
      - 'images/news/**'
      - 'scripts/build-news.mjs'
      - '.github/workflows/build-news.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Сборка и коммит — в одном шаге с повторами.
      # Пока идёт сборка, из админки может прилететь следующая новость;
      # тогда push отклоняется («fetch first») и страницы теряются.
      # На такой случай подтягиваем свежий main и пересобираем: генератор
      # детерминирован и полностью выводится из news/data, поэтому
      # reset --hard безопасен — свежие данные просто попадут в сборку.
      - name: Generate and commit news pages
        run: |
          git config user.name  "lab301-bot"
          git config user.email "bot@lab301.ru"

          for attempt in 1 2 3 4 5; do
            node scripts/build-news.mjs

            git add -A
            if git diff --cached --quiet; then
              echo "Изменений нет — пропускаю коммит."
              exit 0
            fi

            git commit -m "chore(news): regenerate news pages [skip ci]"
            if git push; then
              echo "Страницы опубликованы (попытка $attempt)."
              exit 0
            fi

            echo "Push отклонён — в main появились новые данные. Пересобираю (попытка $attempt)."
            git fetch origin main
            git reset --hard origin/main
            sleep $((attempt * 5))
          done

          echo "::error::Не удалось запушить страницы за 5 попыток."
          exit 1
